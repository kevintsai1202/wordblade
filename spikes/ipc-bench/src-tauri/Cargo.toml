[package]
name = "ipc-bench"
version = "0.1.0"
description = "WordBlade 實測③：ffmpeg 退路的 3D 區段（Tauri IPC 畫格往返）"
authors = ["Kevin Tsai"]
edition = "2024"

[lib]
name = "ipc_bench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
