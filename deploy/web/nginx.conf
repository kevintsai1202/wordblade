# WordBlade 網頁版的 nginx 設定（Zeabur 服務 wordblade-web）。
# COOP／COEP 讓頁面 crossOriginIsolated（WASM 多執行緒、JASSUB 要用，spec §5.21）；
# 呼叫閘道是 CORS 請求，不受 COEP 影響。add_header 在 location 內會整組覆蓋，所以每個 location 都要重寫一次。
# __CSP__ 由 scripts/web-zeabur.ps1 組部署目錄時換成 deploy/csp.mjs 算出的父頁 CSP（含沙盒啟動腳本的 sha256）。
server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 檔名帶雜湊的建置產物：長期快取
    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 其他路徑都回 index.html（單頁應用），index.html 不快取，換版立即生效
    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "__CSP__" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
